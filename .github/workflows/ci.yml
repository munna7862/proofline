name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Typecheck, unit tests, engine calibration
        run: npm run verify
      - name: Dogfood on the demo shop (coverage + fault check)
        run: npm run demo && npm run demo:scan
      - name: Real runner matches ground truth
        run: npm run demo:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofline-report
          path: |
            demo/.proofline/report
            .proofline-calibration/report
